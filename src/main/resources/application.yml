spring:
  application:
    name: study-track-api
  config:
    # Reads KEY=value lines from a git-ignored .env in the working directory (for IDE and mvn runs).
    # Real environment variables still win.
    import: optional:file:.env[.properties]
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/study_track}
    username: ${POSTGRES_USER:study_track}
    password: ${POSTGRES_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # Every table lives in the study_track schema (V10); native SQL names it explicitly.
      hibernate.default_schema: study_track
      # Loads lazy collections (item tags) for a whole page in one query instead of one per item.
      hibernate.default_batch_fetch_size: 50
  flyway:
    enabled: true
    # Keep Flyway's history table in "public" (V10). Without this, Flyway follows the connection's
    # current schema, which becomes "study_track" once that schema exists ("$user" in search_path).
    default-schema: public
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # Request ceiling; MediaService applies the tighter per-image limit (app.media.max-image-bytes).
      max-file-size: 20MB
      max-request-size: 21MB
server:
  port: ${SERVER_PORT:8083}
app:
  # There is no login until accounts are added; every request acts as this user (seeded by V1).
  current-user-id: ${APP_CURRENT_USER_ID:1}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4201}
  # Zone for "today" (due reviews, streaks, activity chart). Blank = the server's zone.
  time-zone: ${APP_TIME_ZONE:America/Chicago}
  catalog:
    # Fills an empty catalog from the CSV files in src/main/resources/catalog at startup (once).
    seed-on-startup: ${CATALOG_SEED_ON_STARTUP:true}
  media:
    # Uploaded images are stored here (relative paths resolve against the working directory).
    storage-dir: ${MEDIA_STORAGE_DIR:./data/media}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:5242880}
    # Images no item, topic, open import candidate or import uses are deleted once they are this old
    # (an editor upload that was never saved, or an image removed by an edit). Daily at 03:30 server time.
    cleanup-cron: ${MEDIA_CLEANUP_CRON:0 30 3 * * *}
    cleanup-grace: ${MEDIA_CLEANUP_GRACE:P7D}
  import:
    # Largest uploaded document (.docx, .pdf, .md, .txt); spring.servlet.multipart is the request ceiling.
    max-file-bytes: ${IMPORT_MAX_FILE_BYTES:20971520}
    # Documents are parsed and sent to the LLM on this many background threads.
    worker-threads: ${IMPORT_WORKER_THREADS:2}
  llm:
    # Defaults until a user saves settings in the app (Settings page, table llm_settings).
    provider: ${LLM_PROVIDER:ANTHROPIC}
    # Read timeout of one LLM call; a 6,000-token chunk can take a few minutes on a large model.
    timeout: ${LLM_TIMEOUT:PT5M}
    max-chunk-tokens: ${LLM_MAX_CHUNK_TOKENS:6000}
    max-chunks-per-job: ${LLM_MAX_CHUNKS_PER_JOB:200}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:16000}
    retry-delay: ${LLM_RETRY_DELAY:PT5S}
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      model: ${ANTHROPIC_MODEL:claude-opus-5-5}
      # From the environment or .env only; never commit a real key.
      api-key: ${ANTHROPIC_API_KEY:}
      effort: ${ANTHROPIC_EFFORT:medium}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      api-key: ${OPENAI_API_KEY:}
    groq:
      # OpenAI-compatible; the client adds /v1/chat/completions.
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      # Supports strict JSON Schema output, which imports need.
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      # From the environment or .env only; never commit a real key.
      api-key: ${GROQ_API_KEY:}
      # Free tier allows about 8,000 tokens per minute, counting input and max output of a call.
      max-chunk-tokens: ${GROQ_MAX_CHUNK_TOKENS:1500}
      max-output-tokens: ${GROQ_MAX_OUTPUT_TOKENS:4000}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.1}
      context-tokens: ${OLLAMA_CONTEXT_TOKENS:16384}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.studytrack.api: ${APP_LOG_LEVEL:INFO}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
