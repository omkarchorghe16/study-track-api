spring:
  datasource:
    url: jdbc:h2:mem:study_track;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
app:
  explanation:
    prefill-pause: PT0S
    prefill-failure-pause: PT0S
    max-consecutive-failures: 2
  catalog:
    # Tests import the seed files themselves when they need them.
    seed-on-startup: false
  media:
    storage-dir: ${java.io.tmpdir}/study-track-test-media
    max-image-bytes: 2048
    # Tests call MediaService.deleteUnusedMedia directly; the schedule is off.
    cleanup-cron: "-"
    cleanup-grace: P7D
  import:
    max-file-bytes: 1048576
    worker-threads: 1
  llm:
    retry-delay: PT0S
    max-chunk-tokens: 200
    max-chunks-per-job: 20
    # Fixed here so a developer's .env (loaded by application.yml) never leaks real keys into tests.
    anthropic:
      api-key: test-key-not-real
    openai:
      api-key: ""
    groq:
      api-key: ""
