apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: study-track-api
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
    - host: dev.study-track.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: study-track-api
                port:
                  number: 80
