apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-track-api
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: study-track-api
  template:
    metadata:
      labels:
        app: study-track-api
    spec:
      containers:
        - name: app
          image: study-track-api:REPLACE_WITH_LOCAL_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
          envFrom:
            - secretRef:
                name: study-track-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
